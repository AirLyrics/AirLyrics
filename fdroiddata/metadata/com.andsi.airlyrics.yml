Categories:
  - Multimedia
License: MIT
AuthorName: AndSi
Name: AirLyrics
SourceCode: https://github.com/AirLyrics/AirLyrics
IssueTracker: https://github.com/AirLyrics/AirLyrics/issues
Changelog: https://github.com/AirLyrics/AirLyrics/releases

Summary: Floating lyrics for Android
Description: |-
  AirLyrics is a lightweight Android app for floating lyrics.

  It can display lyrics in a movable floating window, follow the currently playing media,
  import local LRC and Enhanced LRC files, and search lyrics online.

  Local lyrics import works without online services. Online lyrics search uses third-party
  lyrics services and may depend on network availability.

AntiFeatures:
  NonFreeNet:
    en-US: Online lyrics search uses third-party proprietary lyrics services. Local lyrics import works without these services.

RepoType: git
Repo: https://github.com/AirLyrics/AirLyrics

Builds:
  - versionName: 1.0.3
    versionCode: 4
    commit: v1.0.3
    timeout: 20000
    ndk: 26.3.11579264
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates clang make perl pkg-config
    init:
      - rustup toolchain install 1.88.0
      - rustup default 1.88.0
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk@4.1.2 --locked
    build:
      - export ANDROID_NDK_HOME=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - ./gradlew --no-daemon :app:assembleRelease
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.3
CurrentVersionCode: 4
