[package]
name = "airlyrics_lyrics"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
ncmapi = { version = "0.1.13", package = "ncmapi2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
regex = "1"
openssl = { version = "0.10", features = ["vendored"] }
musixmatch-inofficial = "0.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
