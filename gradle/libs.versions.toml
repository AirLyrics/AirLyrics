[versions]
androidxTestCore = "1.7.0"
robolectric = "4.16.1"
agp = "9.3.0"
coreKtx = "1.19.0"
appcompat = "1.7.1"
material = "1.14.0"
activityKtx = "1.13.0"
documentfile = "1.1.0"
junit = "4.13.2"
json = "20260522"
androidxTestJunit = "1.3.0"
