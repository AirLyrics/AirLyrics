name: Android Instrumentation Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Instrumentation suite
        type: choice
        default: full
        options:
          - fast
          - stress
          - hardware
          - full
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation-x86_64:
    name: Run Android instrumentation on x86_64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK for emulator JNI
        run: |
          bash scripts/ci/install_android_packages.sh "ndk;26.3.11579264" "ndk;29.0.14206865"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build x86_64 Rust JNI
        working-directory: lyrics-core
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" \
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865" \
            cargo ndk \
              -t x86_64 \
              -o ../app/src/main/jniLibs \
              build --release --locked

      - name: Verify x86_64 JNI was built
        run: |
          test -f app/src/main/jniLibs/x86_64/libairlyrics_lyrics.so
          file app/src/main/jniLibs/x86_64/libairlyrics_lyrics.so | grep 'x86-64'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator system image
        run: bash scripts/ci/install_android_packages.sh emulator "system-images;android-35;google_apis;x86_64"

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/run_instrumentation_ci.sh --${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'full' }}

      - name: Verify instrumentation test results
        if: always()
        env:
          INSTRUMENTATION_SUITE: ${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'full' }}
        run: |
          case "$INSTRUMENTATION_SUITE" in
            fast) minimum=25 ;;
            stress) minimum=2 ;;
            hardware) minimum=1 ;;
            full) minimum=28 ;;
          esac
          python3 -B scripts/test_reports/summary.py app/build/outputs/androidTest-results/connected --strict --min-tests "$minimum"

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airlyrics-instrumentation-${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'full' }}-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/test-diagnostics/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
