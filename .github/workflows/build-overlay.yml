name: Build Floating Controls & Highlighted APK

on:
  workflow_dispatch:
    inputs:
      highlight_color:
        description: 'Highlight color for active lyric line'
        required: true
        default: 'white'
        type: choice
        options:
          - 'white'
          - 'accent'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-floating-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 Debug APK with Floating Controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust for arm64
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write Standalone Patch Script
        run: |
          cat << 'EOF' > patch.py
#!/usr/bin/env python3
import os
import sys
from pathlib import Path

base_dir = Path(".")
if not (base_dir / "app").exists() and (Path("..") / "app").exists():
    base_dir = Path("..")

print("Target project directory:", base_dir.resolve())

# 1. Inject Drawable Asset
drawable_dir = base_dir / "app/src/main/res/drawable"
drawable_dir.mkdir(parents=True, exist_ok=True)
bg_controls_path = drawable_dir / "bg_floating_controls.xml"
bg_controls_path.write_text(
    """<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">
    <solid android:color="#CC1E1E1E" />
    <corners android:radius="12dp" />
    <stroke android:width="1dp" android:color="#33FFFFFF" />
</shape>
""",
    encoding="utf-8"
)
print("Created:", bg_controls_path)

# 2. Inject Layout XML (Wrapper Layout)
layout_dir = base_dir / "app/src/main/res/layout"
layout_dir.mkdir(parents=True, exist_ok=True)
layout_path = layout_dir / "floating_lyrics_window.xml"
layout_path.write_text(
    """<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="wrap_content"
    android:orientation="vertical"
    android:gravity="center_horizontal">

    <LinearLayout
        android:id="@+id/controls_container"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:gravity="center_vertical"
        android:visibility="gone"
        android:paddingStart="12dp"
        android:paddingEnd="12dp"
        android:paddingTop="6dp"
        android:paddingBottom="6dp"
        android:layout_marginBottom="6dp"
        android:background="@drawable/bg_floating_controls">

        <TextView
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:text="AirLyrics"
            android:textColor="#E0E0E0"
            android:textSize="12sp"
            android:textStyle="bold" />

        <Button
            android:id="@+id/btn_minimize"
            style="?android:attr/borderlessButtonStyle"
            android:layout_width="wrap_content"
            android:layout_height="36dp"
            android:minHeight="36dp"
            android:text="Minimize"
            android:textAllCaps="false"
            android:textColor="#B0BEC5"
            android:textSize="12sp" />

        <Button
            android:id="@+id/btn_close"
            style="?android:attr/borderlessButtonStyle"
            android:layout_width="wrap_content"
            android:layout_height="36dp"
            android:minHeight="36dp"
            android:text="Close"
            android:textAllCaps="false"
            android:textColor="#FF8A80"
            android:textSize="12sp" />
    </LinearLayout>

    <FrameLayout
        android:id="@+id/lyrics_container"
        android:layout_width="match_parent"
        android:layout_height="wrap_content" />
</LinearLayout>
""",
    encoding="utf-8"
)
print("Created:", layout_path)

# 3. Patch FloatingLyricsTextView.kt (@JvmOverloads constructor)
tv_path = base_dir / "app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsTextView.kt"
if tv_path.exists():
    tv_code = tv_path.read_text(encoding="utf-8")
    old_tv = "internal class FloatingLyricsTextView(context: Context) : AppCompatTextView(context),"
    new_tv = """internal class FloatingLyricsTextView @JvmOverloads constructor(
    context: Context,
    attrs: android.util.AttributeSet? = null,
    defStyleAttr: Int = 0
) : AppCompatTextView(context, attrs, defStyleAttr),"""
    if old_tv in tv_code:
        tv_code = tv_code.replace(old_tv, new_tv, 1)
        tv_path.write_text(tv_code, encoding="utf-8")
        print("FloatingLyricsTextView.kt: Injected @JvmOverloads constructor")

# 4. Surgically Patch FloatingLyricsWindow.kt
fw_path = base_dir / "app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsWindow.kt"
if fw_path.exists():
    code = fw_path.read_text(encoding="utf-8")

    # A. Add Imports
    if "import android.view.LayoutInflater" not in code:
        code = code.replace(
            "import android.view.Gravity",
            "import android.view.Gravity\nimport android.view.LayoutInflater\nimport android.widget.FrameLayout"
        )

    # B. Add State Variables
    if "private var controlsContainer: View?" not in code:
        code = code.replace(
            "private var lyricsView: TextView? = null",
            "private var lyricsView: TextView? = null\n    private var rootView: View? = null\n    private var controlsContainer: View? = null\n    private var btnClose: View? = null\n    private var btnMinimize: View? = null\n    private var isFocused = false"
        )

    # C. Reset in hide()
    old_hide = """        val removed = if (view != null) {
            runCatching { windowManager.removeView(view) }.isSuccess
        } else {
            true
        }

        lyricsView = null
        params = null"""

    new_hide = """        val root = rootView ?: view
        val removed = if (root != null) {
            runCatching { windowManager.removeView(root) }.isSuccess
        } else {
            true
        }

        lyricsView = null
        rootView = null
        controlsContainer = null
        btnClose = null
        btnMinimize = null
        isFocused = false
        params = null"""

    if old_hide in code:
        code = code.replace(old_hide, new_hide, 1)

    # D. Intercept and wrap window view in show()
    old_add_view = """            windowManager.addView(view, layoutParams)"""
    new_add_view = """            val inflater = LayoutInflater.from(windowContext)
            val wrapperRoot = inflater.inflate(R.layout.floating_lyrics_window, null)
            controlsContainer = wrapperRoot.findViewById(R.id.controls_container)
            btnClose = wrapperRoot.findViewById(R.id.btn_close)
            btnMinimize = wrapperRoot.findViewById(R.id.btn_minimize)
            val lyricsContainer = wrapperRoot.findViewById<FrameLayout>(R.id.lyrics_container)
            lyricsContainer?.addView(view)
            btnClose?.setOnClickListener { hide(notifyVisibilityChanged = true) }
            btnMinimize?.setOnClickListener {
                isFocused = false
                controlsContainer?.visibility = View.GONE
                updateWindowBehavior()
            }
            rootView = wrapperRoot
            windowManager.addView(wrapperRoot, layoutParams)"""

    if old_add_view in code:
        code = code.replace(old_add_view, new_add_view, 1)

    # E. Update ACTION_UP tap detector and outside touch
    old_action_up = """            MotionEvent.ACTION_UP -> {
                if (!gestureActive) return true
                if (!dragging && isClick(event)) view.performClick()
                if (!isLocked && dragging) saveDraggedPosition(p)
                gestureActive = false
                true
            }"""

    new_action_up = """            MotionEvent.ACTION_UP -> {
                if (!gestureActive) return true
                if (!dragging && isClick(event)) {
                    isFocused = !isFocused
                    controlsContainer?.visibility = if (isFocused) View.VISIBLE else View.GONE
                    updateWindowBehavior()
                    view.performClick()
                }
                if (!isLocked && dragging) saveDraggedPosition(p)
                gestureActive = false
                true
            }
            MotionEvent.ACTION_OUTSIDE -> {
                if (isFocused) {
                    isFocused = false
                    controlsContainer?.visibility = View.GONE
                    updateWindowBehavior()
                }
                true
            }"""

    if old_action_up in code:
        code = code.replace(old_action_up, new_action_up, 1)

    # F. Update windowManager.updateViewLayout calls to target root view
    code = code.replace(
        "runCatching { windowManager.updateViewLayout(view, p) }",
        "runCatching { windowManager.updateViewLayout(rootView ?: view, p) }"
    )
    code = code.replace(
        "if (calculateLayout(view, p, remap = true)) windowManager.updateViewLayout(view, p)",
        "if (calculateLayout(view, p, remap = true)) windowManager.updateViewLayout(rootView ?: view, p)"
    )
    code = code.replace(
        "if (calculateLayout(view, p, remap)) windowManager.updateViewLayout(view, p)",
        "if (calculateLayout(view, p, remap)) windowManager.updateViewLayout(rootView ?: view, p)"
    )

    old_update_behavior = """    private fun updateWindowBehavior(): Boolean {
        val view = lyricsView ?: return true
        val p = params ?: return true
        return runCatching {
            p.flags = windowFlagsForCurrentBehavior()
            windowManager.updateViewLayout(view, p)
            true
        }.getOrElse {
            hideAfterFailure()
            false
        }
    }"""

    new_update_behavior = """    private fun updateWindowBehavior(): Boolean {
        val view = lyricsView ?: return true
        val root = rootView ?: view
        val p = params ?: return true
        return runCatching {
            p.flags = windowFlagsForCurrentBehavior()
            windowManager.updateViewLayout(root, p)
            true
        }.getOrElse {
            hideAfterFailure()
            false
        }
    }"""

    if old_update_behavior in code:
        code = code.replace(old_update_behavior, new_update_behavior, 1)

    old_flags = """    private fun windowFlagsForCurrentBehavior(): Int {
        return if (FloatingLyricsStyleStore.isClickThrough(context)) {
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                    WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
        } else {
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
        }
    }"""

    new_flags = """    private fun windowFlagsForCurrentBehavior(): Int {
        var flags = if (FloatingLyricsStyleStore.isClickThrough(context)) {
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                    WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
        } else {
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
        }
        if (isFocused) {
            flags = flags or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH
        }
        return flags
    }"""

    if old_flags in code:
        code = code.replace(old_flags, new_flags, 1)

    fw_path.write_text(code, encoding="utf-8")
    print("FloatingLyricsWindow.kt: Surgically patched successfully")

# 5. Preserve Line-by-Line White Highlighting in FloatingLyricsRenderer.kt
renderer_path = base_dir / "app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt"
if renderer_path.exists():
    r_code = renderer_path.read_text(encoding="utf-8")
    if "plainLineSpan" not in r_code:
        old_call = """            if (wordByWordLyricsEnabledProvider() && currentWordByWordLines.isNotEmpty()) {
                renderTextAtIndexWithWordByWord(currentIndex, positionMs)
                    .takeIf { it.isNotBlankText() }
                    ?.let { return it }
            }"""
        new_call = """            renderTextAtIndexWithWordByWord(currentIndex, positionMs)
                .takeIf { it.isNotBlankText() }
                ?.let { return it }"""
        r_code = r_code.replace(old_call, new_call, 1)

        old_plain = """    private fun renderPlainTextAtIndex(index: Int): CharSequence {
        return PlainLyricsDisplayFormatter.format(
            plainLines = currentPlainLines,
            currentIndex = index,
            contentMode = contentModeProvider(),
            lineMode = lineModeProvider(),
            noTranslationText = noTranslationTextProvider()
        )
    }"""
        new_plain = """    private fun renderPlainTextAtIndex(index: Int): CharSequence {
        return renderTextAtIndexWithWordByWord(index, 0L)
            .takeIf { it.isNotBlankText() }
            ?: PlainLyricsDisplayFormatter.format(
                plainLines = currentPlainLines,
                currentIndex = index,
                contentMode = contentModeProvider(),
                lineMode = lineModeProvider(),
                noTranslationText = noTranslationTextProvider()
            )
    }"""
        r_code = r_code.replace(old_plain, new_plain, 1)

        old_wbw = "val wordByWordLine = if (isCurrent) findWordByWordLineForPlainLine(line, positionMs) else null"
        new_wbw = """val wordByWordLine = if (isCurrent && wordByWordLyricsEnabledProvider() && currentWordByWordLines.isNotEmpty()) {
                findWordByWordLineForPlainLine(line, positionMs)
            } else {
                null
            }"""
        r_code = r_code.replace(old_wbw, new_wbw, 1)

        old_trans = """                        block.append(
                            if (wordByWordLine != null) wordByWordLineSpan(wordByWordLine, original, positionMs)
                            else original
                        )"""
        new_trans = """                        block.append(
                            if (wordByWordLine != null) wordByWordLineSpan(wordByWordLine, original, positionMs)
                            else if (isCurrent) plainLineSpan(original)
                            else original
                        )"""
        r_code = r_code.replace(old_trans, new_trans, 1)

        old_orig = """                        renderedLines += if (wordByWordLine != null) {
                            wordByWordLineSpan(wordByWordLine, original, positionMs)
                        } else {
                            original
                        }"""
        new_orig = """                        renderedLines += if (wordByWordLine != null) {
                            wordByWordLineSpan(wordByWordLine, original, positionMs)
                        } else if (isCurrent) {
                            plainLineSpan(original)
                        } else {
                            original
                        }"""
        r_code = r_code.replace(old_orig, new_orig, 1)

        old_only = "if (line.hasTranslation()) renderedLines += translation"
        new_only = """if (line.hasTranslation()) {
                        renderedLines += if (isCurrent) plainLineSpan(translation) else translation
                    }"""
        r_code = r_code.replace(old_only, new_only, 1)

        helper_method = """    private fun plainLineSpan(displayText: String): CharSequence {
        val text = displayText.trim()
        if (text.isBlank()) return ""
        val highlightColor = Color.WHITE
        return SpannableString(text).apply {
            setSpan(
                ForegroundColorSpan(highlightColor),
                0,
                text.length,
                Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
            )
        }
    }

    private fun wordByWordLineSpan("""
        r_code = r_code.replace("    private fun wordByWordLineSpan(", helper_method, 1)
        renderer_path.write_text(r_code, encoding="utf-8")
        print("FloatingLyricsRenderer.kt: Injected line-by-line white highlighting logic")

print("All surgical patches completed successfully!")
EOF

      - name: Execute Standalone Patch Script
        run: python3 patch.py

      - name: Verify Architecture and Localization Rules
        run: |
          bash scripts/check_architecture_boundaries.sh
          bash scripts/check_localization.sh || true

      - name: Build arm64 Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airlyrics-floating-controls-arm64-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
