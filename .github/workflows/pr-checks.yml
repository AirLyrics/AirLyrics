name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    name: Android lint, tests, and localization
    runs-on: ubuntu-latest
    env:
      UPDATER_TEST_CLASS: com.andsi.airlyrics.app.MainActivityAuxiliaryRecreationTest
      UPDATER_TEST_METHOD: narrowChineseUpdaterChecksDownloadsAndInstalls

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK for Android lint
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare scripts
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/check_localization.sh
          chmod +x ./scripts/check_architecture_boundaries.sh

      - name: Run Android lint
        run: ./gradlew :app:lintDebug -Pairlyrics.skipRustBuild=true --stacktrace

      - name: Set up JDK for tests and builds
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check architecture sources, bytecode, policy, and checker tests
        run: ./scripts/check_architecture_boundaries.sh

      - name: Test lyrics tooling
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_apple_lyrics_fetch.py'
          python3 -B -m unittest discover -s scripts/lyrics_benchmark -p 'test_*.py'

      - name: Test XML report summary
        run: python3 -B -m unittest discover -s scripts/test_reports -p 'test_*.py'

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest -Pairlyrics.skipRustBuild=true --stacktrace

      - name: Test localization checker
        run: python3 -B -m unittest discover -s scripts/localization -p 'test_*.py'

      - name: Check localization
        run: ./scripts/check_localization.sh

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Summarize JVM results
        if: always()
        run: >-
          python3 -B scripts/test_reports/summary.py app/build/test-results/testDebugUnitTest
          --strict
          --allow-skipped-test "$UPDATER_TEST_CLASS#$UPDATER_TEST_METHOD"
          --require-test "$UPDATER_TEST_CLASS#versionEntryShowsOneReleaseAndRestoresSelection"
          --require-test "$UPDATER_TEST_CLASS#spanishStatusFitsOnANarrowScreen"

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Run updater-enabled JVM test
        run: >-
          ./gradlew :app:testDebugUnitTest -Pairlyrics.skipRustBuild=true
          -Pairlyrics.enableAppUpdateInstaller=true
          --tests "$UPDATER_TEST_CLASS.$UPDATER_TEST_METHOD" --stacktrace

      - name: Summarize updater-enabled JVM result
        if: always()
        run: >-
          python3 -B scripts/test_reports/summary.py app/build/test-results/testDebugUnitTest-updater-enabled
          --strict --min-tests 1 --require-test "$UPDATER_TEST_CLASS#$UPDATER_TEST_METHOD"

      - name: Upload updater-enabled JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-updater-enabled-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest-updater-enabled/
            app/build/test-results/testDebugUnitTest-updater-enabled/
          if-no-files-found: ignore

  android-debug-build:
    name: Debug APK build without Rust rebuild
    runs-on: ubuntu-latest
    needs: android-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Pairlyrics.skipRustBuild=true --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airlyrics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
