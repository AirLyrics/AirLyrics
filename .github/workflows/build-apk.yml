name: Commit Highlighted Lyrics Patch

on:
  workflow_dispatch:
    inputs:
      highlight_color:
        description: 'Highlight color for active lyric line'
        required: true
        default: 'accent'
        type: choice
        options:
          - 'accent'
          - 'white'

permissions:
  contents: write

jobs:
  commit-patch:
    name: Apply Patch and Commit to Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Apply Line-by-Line Lyric Highlight Patch
        run: |
          git apply << 'EOF'
          diff --git a/app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt b/app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt
          --- a/app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt
          +++ b/app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt
          @@ -152,11 +152,9 @@ class FloatingLyricsRenderer(
                   val currentIndex = LrcParser.findCurrentIndex(currentPlainLines, positionMs)
           
                   if (currentIndex != null) {
          -            if (wordByWordLyricsEnabledProvider() && currentWordByWordLines.isNotEmpty()) {
          -                renderTextAtIndexWithWordByWord(currentIndex, positionMs)
          -                    .takeIf { it.isNotBlankText() }
          -                    ?.let { return it }
          -            }
          +            renderTextAtIndexWithWordByWord(currentIndex, positionMs)
          +                .takeIf { it.isNotBlankText() }
          +                ?.let { return it }
                       return renderPlainTextAtIndex(currentIndex)
                   }
           
          @@ -175,13 +173,15 @@ class FloatingLyricsRenderer(
               }
           
               private fun renderPlainTextAtIndex(index: Int): CharSequence {
          -        return PlainLyricsDisplayFormatter.format(
          -            plainLines = currentPlainLines,
          -            currentIndex = index,
          -            contentMode = contentModeProvider(),
          -            lineMode = lineModeProvider(),
          -            noTranslationText = noTranslationTextProvider()
          -        )
          +        return renderTextAtIndexWithWordByWord(index, 0L)
          +            .takeIf { it.isNotBlankText() }
          +            ?: PlainLyricsDisplayFormatter.format(
          +                plainLines = currentPlainLines,
          +                currentIndex = index,
          +                contentMode = contentModeProvider(),
          +                lineMode = lineModeProvider(),
          +                noTranslationText = noTranslationTextProvider()
          +            )
               }
           
               /**
          @@ -209,7 +209,11 @@ class FloatingLyricsRenderer(
                       }
           
                       val isCurrent = index == currentIndex
          -            val wordByWordLine = if (isCurrent) findWordByWordLineForPlainLine(line, positionMs) else null
          +            val wordByWordLine = if (isCurrent && wordByWordLyricsEnabledProvider() && currentWordByWordLines.isNotEmpty()) {
          +                findWordByWordLineForPlainLine(line, positionMs)
          +            } else {
          +                null
          +            }
           
                       when (contentMode) {
                           LyricsContentDisplayMode.ORIGINAL_WITH_TRANSLATION -> {
          @@ -217,6 +221,7 @@ class FloatingLyricsRenderer(
                               if (original.isNotBlank()) {
                                   block.append(
                                       if (wordByWordLine != null) wordByWordLineSpan(wordByWordLine, original, positionMs)
          +                            else if (isCurrent) plainLineSpan(original)
                                       else original
                                   )
                               }
          @@ -231,6 +236,8 @@ class FloatingLyricsRenderer(
                                   if (original.isNotBlank()) {
                                       renderedLines += if (wordByWordLine != null) {
                                           wordByWordLineSpan(wordByWordLine, original, positionMs)
          +                        } else if (isCurrent) {
          +                            plainLineSpan(original)
                                       } else {
                                           original
                                       }
          @@ -238,7 +245,9 @@ class FloatingLyricsRenderer(
                           }
           
                           LyricsContentDisplayMode.TRANSLATION_ONLY -> {
          -                    if (line.hasTranslation()) renderedLines += translation
          +                    if (line.hasTranslation()) {
          +                        renderedLines += if (isCurrent) plainLineSpan(translation) else translation
          +                    }
                           }
                       }
                   }
          @@ -326,6 +335,20 @@ class FloatingLyricsRenderer(
                       return indexes.filter { it in currentWordByWordLines.indices }
                   }
               
          +    private fun plainLineSpan(displayText: String): CharSequence {
          +        val text = displayText.trim()
          +        if (text.isBlank()) return ""
          +        val highlightColor = wordByWordHighlightColorProvider()
          +        return SpannableString(text).apply {
          +            setSpan(
          +                ForegroundColorSpan(highlightColor),
          +                0,
          +                text.length,
          +                Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
          +            )
          +        }
          +    }
          +
                   private fun wordByWordLineSpan(
                       wordByWordLine: WordByWordLine,
                       displayText: String,
          EOF

      - name: Configure Highlight Color
        if: ${{ inputs.highlight_color == 'white' }}
        run: |
          sed -i 's/val highlightColor = wordByWordHighlightColorProvider()/val highlightColor = Color.WHITE/' \
            app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt
          git commit -m "feat: implement line-by-line highlight"
          git push origin HEAD
          
