name: Commit Safe Highlight Patch

on:
  workflow_dispatch:
    inputs:
      highlight_color:
        description: 'Highlight color for active lyric line'
        required: true
        default: 'accent'
        type: choice
        options:
          - 'accent'
          - 'white'

permissions:
  contents: write

jobs:
  commit-patch:
    name: Apply Safe Patch and Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Safe Highlight Logic
        env:
          HIGHLIGHT_COLOR: ${{ inputs.highlight_color }}
        shell: python
        run: |
          import os
          from pathlib import Path

          base_dir = Path(".")
          if not (base_dir / "app").exists() and (Path("..") / "app").exists():
              base_dir = Path("..")

          rn_path = base_dir / "app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt"
          if rn_path.exists():
              rn = rn_path.read_text()
              
              # Use the default accent color, or override with hardcoded white if selected
              color_expr = "android.graphics.Color.WHITE" if os.environ.get("HIGHLIGHT_COLOR") == "white" else "wordByWordHighlightColorProvider()"
              
              old_plain = "    private fun renderPlainTextAtIndex(index: Int): CharSequence {\n        return PlainLyricsDisplayFormatter.format(\n            plainLines = currentPlainLines,\n            currentIndex = index,\n            contentMode = contentModeProvider(),\n            lineMode = lineModeProvider(),\n            noTranslationText = noTranslationTextProvider()\n        )\n    }"
              
              new_plain = f"""    private fun renderPlainTextAtIndex(index: Int): CharSequence {{
          val formatted = PlainLyricsDisplayFormatter.format(
              plainLines = currentPlainLines,
              currentIndex = index,
              contentMode = contentModeProvider(),
              lineMode = lineModeProvider(),
              noTranslationText = noTranslationTextProvider()
          )
          val currentLineText = currentPlainLines.getOrNull(index)?.original?.trim()
          if (currentLineText.isNullOrBlank()) return formatted
          
          val span = android.text.SpannableString(formatted)
          val startIdx = formatted.indexOf(currentLineText)
          if (startIdx >= 0) {{
              span.setSpan(
                  android.text.style.ForegroundColorSpan({color_expr}),
                  startIdx,
                  startIdx + currentLineText.length,
                  android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
              )
          }}
          return span
      }}"""
              if "val formatted = PlainLyricsDisplayFormatter" not in rn:
                  rn = rn.replace(old_plain, new_plain)
                  rn_path.write_text(rn)
                  print("Safely patched FloatingLyricsRenderer.kt")
              else:
                  print("Patch already applied.")
          else:
              print("Could not find FloatingLyricsRenderer.kt")

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt
          git commit -m "feat: safely implement line-by-line highlight for plain lyrics"
          git push origi
          n HEAD
