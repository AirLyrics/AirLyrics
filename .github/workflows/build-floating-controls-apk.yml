name: Build Floating Controls & Highlighted APK

on:
  workflow_dispatch:
    inputs:
      highlight_color:
        description: 'Highlight color for active lyric line'
        required: true
        default: 'white'
        type: choice
        options:
          - 'white'
          - 'accent'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-floating-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 Debug APK with Floating Controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust for arm64
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Floating Controls & Line-by-Line Highlighting
        env:
          HIGHLIGHT_COLOR: ${{ inputs.highlight_color || 'white' }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          print("--- 1. Injecting Drawable Asset ---")
          drawable_dir = Path("app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          bg_controls_path = drawable_dir / "bg_floating_controls.xml"
          bg_controls_path.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#CC1E1E1E" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
          </shape>
          """, encoding="utf-8")

          print("--- 2. Injecting Layout XML (Wrapper) ---")
          layout_dir = Path("app/src/main/res/layout")
          layout_dir.mkdir(parents=True, exist_ok=True)
          layout_path = layout_dir / "floating_lyrics_window.xml"
          layout_path.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:gravity="center_horizontal">

              <LinearLayout
                  android:id="@+id/controls_container"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:visibility="gone"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:paddingTop="6dp"
                  android:paddingBottom="6dp"
                  android:layout_marginBottom="6dp"
                  android:background="@drawable/bg_floating_controls">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="AirLyrics"
                      android:textColor="#E0E0E0"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btn_minimize"
                      style="?android:attr/borderlessButtonStyle"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:minHeight="36dp"
                      android:text="Minimize"
                      android:textAllCaps="false"
                      android:textColor="#B0BEC5"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/btn_close"
                      style="?android:attr/borderlessButtonStyle"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:minHeight="36dp"
                      android:text="Close"
                      android:textAllCaps="false"
                      android:textColor="#FF8A80"
                      android:textSize="12sp" />
              </LinearLayout>

              <!-- We will programmatically inject the original TextView into this FrameLayout -->
              <FrameLayout
                  android:id="@+id/lyrics_container"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content" />

          </LinearLayout>
          """, encoding="utf-8")

          print("--- 3. Surgically Patching FloatingLyricsWindow.kt ---")
          fw_path = Path("app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsWindow.kt")
          code = fw_path.read_text(encoding="utf-8")

          imports = ["import android.view.LayoutInflater", "import com.andsi.airlyrics.R", "import android.view.ViewConfiguration"]
          for imp in imports:
              if imp not in code:
                  code = code.replace("import android.view.View", f"{imp}\nimport android.view.View")

          if "private var controlsContainer: View?" not in code:
              code = code.replace("private var rootView: View? = null", 
                  "private var rootView: View? = null\n"
                  "    private var controlsContainer: View? = null\n"
                  "    private var btnClose: View? = null\n"
                  "    private var btnMinimize: View? = null\n"
                  "    private var isFocused = false\n")

          if "controlsContainer = null" not in code:
              code = code.replace("rootView = null", 
                  "rootView = null\n        controlsContainer = null\n        btnClose = null\n        btnMinimize = null\n        isFocused = false")

          add_view_match = re.search(r'windowManager\.addView\(([^,]+),\s*([^)]+)\)', code)
          if add_view_match:
              added_view = add_view_match.group(1) 
              params_var = add_view_match.group(2) 
              
              wrapper_logic = f"""
                      val inflater = LayoutInflater.from(windowContext)
                      val wrapperRoot = inflater.inflate(R.layout.floating_lyrics_window, null)
                      controlsContainer = wrapperRoot.findViewById(R.id.controls_container)
                      btnClose = wrapperRoot.findViewById(R.id.btn_close)
                      btnMinimize = wrapperRoot.findViewById(R.id.btn_minimize)
                      
                      val lyricsContainer = wrapperRoot.findViewById<android.widget.FrameLayout>(R.id.lyrics_container)
                      lyricsContainer.addView({added_view})
                      
                      btnClose?.setOnClickListener {{ hide(notifyVisibilityChanged = true) }}
                      btnMinimize?.setOnClickListener {{ 
                          isFocused = false
                          controlsContainer?.visibility = View.GONE
                          updateWindowBehavior()
                      }}
                      
                      rootView = wrapperRoot
                      windowManager.addView(wrapperRoot, {params_var})
              """
              code = re.sub(r'rootView\s*=\s*' + added_view, '// rootView reassigned to wrapper later', code)
              code = re.sub(added_view + r'\.setOnTouchListener', 'wrapperRoot.setOnTouchListener', code)
              code = code.replace(add_view_match.group(0), wrapper_logic.strip())

          action_up_pattern = r'(MotionEvent\.ACTION_UP\s*->\s*\{)([\s\S]*?)(gestureActive\s*=\s*false)'
          def replace_action_up(m):
              return m.group(1) + """
                          val touchSlop = ViewConfiguration.get(context).scaledTouchSlop
                          val isClick = kotlin.math.abs(event.rawX - touchStartX) <= touchSlop &&
                                        kotlin.math.abs(event.rawY - touchStartY) <= touchSlop
                          val duration = android.os.SystemClock.uptimeMillis() - downUptimeMs

                          if (!dragging && isClick && duration <= 600) {
                              isFocused = !isFocused
                              controlsContainer?.visibility = if (isFocused) View.VISIBLE else View.GONE
                              updateWindowBehavior()
                          }
          """ + m.group(2) + m.group(3)
          
          if "isFocused = !isFocused" not in code:
              code = re.sub(action_up_pattern, replace_action_up, code)

          if "fun updateWindowBehavior" not in code:
              code = code.replace("private fun windowFlagsForCurrentBehavior",
          """private fun updateWindowBehavior() {
              val root = rootView ?: return
              val p = params ?: return
              runCatching {
                  p.flags = windowFlagsForCurrentBehavior()
                  if (isFocused) {
                      p.flags = p.flags or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH
                  }
                  windowManager.updateViewLayout(root, p)
              }
          }

          private fun windowFlagsForCurrentBehavior""")

          fw_path.write_text(code, encoding="utf-8")
          print("Surgical patch applied successfully!")

          print("--- 4. Preserving Line-by-Line Highlighting in FloatingLyricsRenderer.kt ---")
          renderer_path = Path("app/src/main/java/com/andsi/airlyrics/floating/FloatingLyricsRenderer.kt")
          r_code = renderer_path.read_text(encoding="utf-8")
          highlight_mode = os.environ.get("HIGHLIGHT_COLOR", "white").lower()
          highlight_color_expr = "Color.WHITE" if highlight_mode == "white" else "wordByWordHighlightColorProvider()"

          if "plainLineSpan" not in r_code:
              old_call = """            if (wordByWordLyricsEnabledProvider() && currentWordByWordLines.isNotEmpty()) {
                  renderTextAtIndexWithWordByWord(currentIndex, positionMs)
                      .takeIf { it.isNotBlankText() }
                      ?.let { return it }
              }"""
              new_call = """            renderTextAtIndexWithWordByWord(currentIndex, positionMs)
                  .takeIf { it.isNotBlankText() }
                  ?.let { return it }"""
              r_code = r_code.replace(old_call, new_call, 1)

              old_plain = """    private fun renderPlainTextAtIndex(index: Int): CharSequence {
          return PlainLyricsDisplayFormatter.format(
              plainLines = currentPlainLines,
              currentIndex = index,
              contentMode = contentModeProvider(),
              lineMode = lineModeProvider(),
              noTranslationText = noTranslationTextProvider()
          )
      }"""
              new_plain = """    private fun renderPlainTextAtIndex(index: Int): CharSequence {
          return renderTextAtIndexWithWordByWord(index, 0L)
              .takeIf { it.isNotBlankText() }
              ?: PlainLyricsDisplayFormatter.format(
                  plainLines = currentPlainLines,
                  currentIndex = index,
                  contentMode = contentModeProvider(),
                  lineMode = lineModeProvider(),
                  noTranslationText = noTranslationTextProvider()
              )
      }"""
              r_code = r_code.replace(old_plain, new_plain, 1)

              old_wbw = "val wordByWordLine = if (isCurrent) findWordByWordLineForPlainLine(line, positionMs) else null"
              new_wbw = """val wordByWordLine = if (isCurrent && wordByWordLyricsEnabledProvider() && currentWordByWordLines.isNotEmpty()) {
                  findWordByWordLineForPlainLine(line, positionMs)
              } else {
                  null
              }"""
              r_code = r_code.replace(old_wbw, new_wbw, 1)

              old_trans = """                        block.append(
                              if (wordByWordLine != null) wordByWordLineSpan(wordByWordLine, original, positionMs)
                              else original
                          )"""
              new_trans = """                        block.append(
                              if (wordByWordLine != null) wordByWordLineSpan(wordByWordLine, original, positionMs)
                              else if (isCurrent) plainLineSpan(original)
                              else original
                          )"""
              r_code = r_code.replace(old_trans, new_trans, 1)

              old_orig = """                        renderedLines += if (wordByWordLine != null) {
                              wordByWordLineSpan(wordByWordLine, original, positionMs)
                          } else {
                              original
                          }"""
              new_orig = """                        renderedLines += if (wordByWordLine != null) {
                              wordByWordLineSpan(wordByWordLine, original, positionMs)
                          } else if (isCurrent) {
                              plainLineSpan(original)
                          } else {
                              original
                          }"""
              r_code = r_code.replace(old_orig, new_orig, 1)

              old_only = "if (line.hasTranslation()) renderedLines += translation"
              new_only = """if (line.hasTranslation()) {
                          renderedLines += if (isCurrent) plainLineSpan(translation) else translation
                      }"""
              r_code = r_code.replace(old_only, new_only, 1)

              helper_method = f"""    private fun plainLineSpan(displayText: String): CharSequence {{
          val text = displayText.trim()
          if (text.isBlank()) return ""
          val highlightColor = {highlight_color_expr}
          return SpannableString(text).apply {{
              setSpan(
                  android.text.style.ForegroundColorSpan(highlightColor),
                  0,
                  text.length,
                  android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
              )
          }}
      }}

      private fun wordByWordLineSpan("""
              r_code = r_code.replace("    private fun wordByWordLineSpan(", helper_method, 1)
              renderer_path.write_text(r_code, encoding="utf-8")
              print("Injected line-by-line highlight logic.")
          else:
              print("Highlight logic already exists.")

      - name: Verify Architecture and Localization Rules
        run: |
          bash scripts/check_architecture_boundaries.sh
          bash scripts/check_localization.sh || true

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airlyrics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
